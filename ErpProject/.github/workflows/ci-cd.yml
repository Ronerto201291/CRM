name: ERP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/Erp.slnx
        working-directory: ./ErpProject

      - name: Build
        run: dotnet build backend/Erp.slnx --no-restore -c Release
        working-directory: ./ErpProject

      - name: Vulnerable package scan
        run: |
          dotnet list backend/Erp.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::warning::Se encontraron paquetes vulnerables — revisar vulnerable.txt"
          fi
        working-directory: ./ErpProject

      - name: Test
        run: dotnet test backend/Erp.slnx --no-build -c Release
        working-directory: ./ErpProject

      - name: Build Docker Image
        if: github.ref == 'refs/heads/main'
        run: docker build -t erp-api:${{ github.sha }} -f backend/Dockerfile .
        working-directory: ./ErpProject

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ErpProject/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./ErpProject/frontend

      - name: Audit dependencies
        run: npm audit --audit-level=high || true
        working-directory: ./ErpProject/frontend

      - name: Build
        run: npm run build
        working-directory: ./ErpProject/frontend

      - name: Build Docker Image
        if: github.ref == 'refs/heads/main'
        run: docker build -t erp-frontend:${{ github.sha }} -f frontend/Dockerfile .
        working-directory: ./ErpProject/frontend
