name: ERP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/Erp.slnx
        working-directory: ./ErpProject

      - name: Build
        run: dotnet build backend/Erp.slnx --no-restore -c Release
        working-directory: ./ErpProject

      - name: Vulnerable package scan
        run: |
          dotnet list backend/Erp.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::warning::Se encontraron paquetes vulnerables — revisar vulnerable.txt"
          fi
        working-directory: ./ErpProject

      - name: Architecture tests
        run: dotnet test backend/tests/Erp.ArchitectureTests/Erp.ArchitectureTests.csproj -c Release --no-build --verbosity minimal
        working-directory: ./ErpProject

      - name: Unit tests + coverage
        run: |
          dotnet test backend/tests/Erp.Tests/Erp.Tests.csproj -c Release --no-build \
            --results-directory backend/TestResults/coverage-gate-unit \
            --collect:"XPlat Code Coverage" -- \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        working-directory: ./ErpProject

      - name: Integration tests + coverage
        run: |
          dotnet test backend/tests/Erp.IntegrationTests/Erp.IntegrationTests.csproj -c Release --no-build \
            --results-directory backend/TestResults/coverage-gate-int \
            --collect:"XPlat Code Coverage" -- \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        working-directory: ./ErpProject

      - name: Coverage gate (bloquea deploy si baja)
        run: |
          UNIT_XML=$(find backend/TestResults/coverage-gate-unit -name 'coverage.cobertura.xml' | head -1)
          INT_XML=$(find backend/TestResults/coverage-gate-int -name 'coverage.cobertura.xml' | head -1)
          if [ -z "$UNIT_XML" ] || [ -z "$INT_XML" ]; then
            echo "::error::No se encontró coverage.cobertura.xml"
            exit 1
          fi
          python3 scripts/check-coverage.py \
            --unit "$UNIT_XML" \
            --integration "$INT_XML" \
            --thresholds scripts/coverage-thresholds.json
        working-directory: ./ErpProject

      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ErpProject/backend/TestResults/coverage-gate-unit/**/coverage.cobertura.xml,ErpProject/backend/TestResults/coverage-gate-int/**/coverage.cobertura.xml
          fail_ci_if_error: false

  # Job E2E Playwright con stack Docker (push main + PRs) — depende de coverage gates
  e2e-playwright:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ErpProject/frontend/package-lock.json

      - name: Start stack
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_test_secret/' .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci_jwt_secret_min_32_chars_long_abc/' .env
          docker compose up -d --build
        working-directory: ./ErpProject

      - name: Wait for services
        run: |
          for i in $(seq 1 90); do
            frontend_ok=0
            backend_ok=0
            curl -sf http://localhost:3000 > /dev/null && frontend_ok=1
            curl -sf http://localhost:8081/health > /dev/null && backend_ok=1
            if [ "$frontend_ok" = "1" ] && [ "$backend_ok" = "1" ]; then
              echo "Stack ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for stack... ($i/90) frontend=$frontend_ok backend=$backend_ok"
            sleep 5
          done
          echo "Stack did not become ready in time"
          docker compose ps
          docker compose logs --tail=80
          exit 1
        working-directory: ./ErpProject

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./ErpProject/frontend

      - name: E2E smoke
        run: npm run test:e2e
        working-directory: ./ErpProject/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Build Docker Image
        if: github.ref == 'refs/heads/main'
        run: docker build -t erp-api:${{ github.sha }} -f backend/Dockerfile .
        working-directory: ./ErpProject

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ErpProject/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./ErpProject/frontend

      - name: Audit dependencies
        run: npm audit --audit-level=high || true
        working-directory: ./ErpProject/frontend

      - name: Lint
        run: npm run lint
        working-directory: ./ErpProject/frontend

      - name: Test + coverage gate (bloquea deploy si baja)
        run: npm run test:coverage
        working-directory: ./ErpProject/frontend

      - name: Build
        run: npm run build
        working-directory: ./ErpProject/frontend

      - name: Build Docker Image
        if: github.ref == 'refs/heads/main'
        run: docker build -t erp-frontend:${{ github.sha }} -f frontend/Dockerfile .
        working-directory: ./ErpProject/frontend
