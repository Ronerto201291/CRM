name: CI/CD — ERP SaaS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/erp-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/erp-frontend

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build & Test
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ErpProject/backend/Erp.Api/Erp.Api.csproj

      - name: Build
        run: dotnet build ErpProject/backend/Erp.Api/Erp.Api.csproj --no-restore -c Release

      - name: Run tests
        run: |
          if find ErpProject/backend -name '*.Tests.csproj' | grep -q .; then
            dotnet test ErpProject/backend --no-build -c Release --logger "trx;LogFileName=results.trx"
          else
            echo "No test projects found — skipping."
          fi

  # ─────────────────────────────────────────────
  # JOB 2: Build & Push Docker images
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only push images on main branch pushes (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ErpProject/backend
          file: ErpProject/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ErpProject/frontend
          file: ErpProject/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to Hetzner via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout (deploy scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: ErpProject/deploy

      - name: Write SSH key
        run: |
          install -m 600 /dev/null ~/.ssh/hetzner_key
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Deploy via SSH
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          SHA:  ${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_BACKEND: ${{ env.IMAGE_BACKEND }}
          IMAGE_FRONTEND: ${{ env.IMAGE_FRONTEND }}
        run: |
          ssh -i ~/.ssh/hetzner_key "${USER}@${HOST}" bash <<'ENDSSH'
            set -euo pipefail
            cd /opt/erp

            # Pull updated images (tagged :latest pushed above)
            docker compose pull backend frontend

            # Re-create only changed containers; leave postgres/redis/nginx untouched
            docker compose up -d --no-deps --remove-orphans backend frontend

            # Wait for backend health check
            echo "Waiting for backend to be healthy..."
            for i in $(seq 1 20); do
              if curl -sf http://localhost:5000/health/live > /dev/null; then
                echo "Backend healthy after ${i}s"
                break
              fi
              sleep 3
            done

            # Prune dangling images to reclaim disk
            docker image prune -f
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/hetzner_key
