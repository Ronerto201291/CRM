name: CI/CD — ERP SaaS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/erp-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/erp-frontend

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Backend build, tests & coverage gate
  # ─────────────────────────────────────────────
  backend-build:
    name: Backend Build & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ErpProject/backend/Erp.slnx

      - name: Build
        run: dotnet build ErpProject/backend/Erp.slnx --no-restore -c Release

      - name: Vulnerable package scan
        run: |
          dotnet list ErpProject/backend/Erp.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::warning::Se encontraron paquetes vulnerables — revisar vulnerable.txt"
          fi

      - name: Architecture tests
        run: dotnet test ErpProject/backend/tests/Erp.ArchitectureTests/Erp.ArchitectureTests.csproj -c Release --no-build --verbosity minimal

      - name: Unit tests + coverage
        run: |
          dotnet test ErpProject/backend/tests/Erp.Tests/Erp.Tests.csproj -c Release --no-build \
            --results-directory ErpProject/backend/TestResults/coverage-gate-unit \
            --collect:"XPlat Code Coverage" -- \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Integration tests + coverage
        run: |
          dotnet test ErpProject/backend/tests/Erp.IntegrationTests/Erp.IntegrationTests.csproj -c Release --no-build \
            --results-directory ErpProject/backend/TestResults/coverage-gate-int \
            --collect:"XPlat Code Coverage" -- \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Coverage gate (bloquea deploy si baja)
        run: |
          UNIT_XML=$(find ErpProject/backend/TestResults/coverage-gate-unit -name 'coverage.cobertura.xml' | head -1)
          INT_XML=$(find ErpProject/backend/TestResults/coverage-gate-int -name 'coverage.cobertura.xml' | head -1)
          if [ -z "$UNIT_XML" ] || [ -z "$INT_XML" ]; then
            echo "::error::No se encontró coverage.cobertura.xml"
            exit 1
          fi
          python3 ErpProject/scripts/check-coverage.py \
            --unit "$UNIT_XML" \
            --integration "$INT_XML" \
            --thresholds ErpProject/scripts/coverage-thresholds.json

      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ErpProject/backend/TestResults/coverage-gate-unit/**/coverage.cobertura.xml,ErpProject/backend/TestResults/coverage-gate-int/**/coverage.cobertura.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────
  # JOB 2: Frontend lint, tests & coverage gate
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ErpProject/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ErpProject/frontend

      - name: Audit dependencies
        run: npm audit --audit-level=high || true
        working-directory: ErpProject/frontend

      - name: Lint
        run: npm run lint
        working-directory: ErpProject/frontend

      - name: Test + coverage gate (bloquea deploy si baja)
        run: npm run test:coverage
        working-directory: ErpProject/frontend

      - name: Build
        run: npm run build
        working-directory: ErpProject/frontend

  # ─────────────────────────────────────────────
  # JOB 3: E2E Playwright (stack Docker)
  # ─────────────────────────────────────────────
  e2e-playwright:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ErpProject/frontend/package-lock.json

      - name: Start stack
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_test_secret/' .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci_jwt_secret_min_32_chars_long_abc/' .env
          docker compose up -d --build
        working-directory: ErpProject

      - name: Wait for services
        run: |
          for i in $(seq 1 90); do
            frontend_ok=0
            backend_ok=0
            curl -sf http://localhost:3000 > /dev/null && frontend_ok=1
            curl -sf http://localhost:8081/health > /dev/null && backend_ok=1
            if [ "$frontend_ok" = "1" ] && [ "$backend_ok" = "1" ]; then
              echo "Stack ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for stack... ($i/90) frontend=$frontend_ok backend=$backend_ok"
            sleep 5
          done
          echo "Stack did not become ready in time"
          docker compose ps
          docker compose logs --tail=80
          exit 1
        working-directory: ErpProject

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ErpProject/frontend

      - name: E2E smoke
        run: npm run test:e2e
        working-directory: ErpProject/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

  # ─────────────────────────────────────────────
  # JOB 4: Build & Push Docker images (solo main)
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, e2e-playwright]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ErpProject/backend
          file: ErpProject/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ErpProject/frontend
          file: ErpProject/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 5: Deploy to Hetzner via SSH (solo main)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout (deploy scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: ErpProject/deploy

      - name: Write SSH key
        run: |
          install -m 600 /dev/null ~/.ssh/hetzner_key
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Deploy via SSH
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          SHA: ${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_BACKEND: ${{ env.IMAGE_BACKEND }}
          IMAGE_FRONTEND: ${{ env.IMAGE_FRONTEND }}
        run: |
          ssh -i ~/.ssh/hetzner_key "${USER}@${HOST}" bash <<'ENDSSH'
            set -euo pipefail
            cd /opt/erp

            # Pull updated images (tagged :latest pushed above)
            docker compose pull backend frontend

            # Re-create only changed containers; leave postgres/redis/nginx untouched
            docker compose up -d --no-deps --remove-orphans backend frontend

            # Wait for backend health check (backend escucha en 8080 — ver backend/Dockerfile)
            echo "Waiting for backend to be healthy..."
            healthy=0
            for i in $(seq 1 20); do
              if curl -sf http://localhost:8080/health/live > /dev/null; then
                echo "Backend healthy after ${i}s"
                healthy=1
                break
              fi
              sleep 3
            done
            if [ "$healthy" != "1" ]; then
              echo "::error::Backend health check failed on :8080/health/live"
              docker compose ps
              docker compose logs --tail=40 backend
              exit 1
            fi

            # Prune dangling images to reclaim disk
            docker image prune -f
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/hetzner_key
